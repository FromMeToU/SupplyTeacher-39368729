<!DOCTYPE html>
<html lang="th">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดตารางสอนแทน (กรณีครูลากิจ/ป่วย)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

        .action-button { @apply inline-flex items-center justify-center px-5 py-2.5 text-base font-medium text-center text-white rounded-lg shadow-md transition duration-150 ease-in-out focus:ring-4 focus:outline-none w-full sm:w-auto; }
        .tab-button { @apply px-4 py-2 text-lg font-medium border-b-2 border-transparent hover:border-indigo-500 hover:text-indigo-600 focus:outline-none transition duration-150 ease-in-out; }
        .tab-button.active { @apply border-indigo-500 text-indigo-600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: #333; color: #fff; padding: 10px 20px; border-radius: 5px; opacity: 0; transition: opacity 0.5s ease-in-out; z-index: 1000; text-align: center; }
        #toast.show { opacity: 1; }
        /* Custom Checkbox Style for Teachers - Fixed */
        .teacher-checkbox-input:checked + label {
            background-color: #e0e7ff; /* bg-indigo-100 */
            border-color: #6366f1; /* border-indigo-500 */
            box-shadow: 0 0 0 1px #6366f1; /* ring-1 ring-indigo-500 */
        }
        .teacher-checkbox-input:checked + label .custom-check-box {
            background-color: #6366f1; /* bg-indigo-500 */
            border-color: #6366f1;
        }
        .teacher-checkbox-input:checked + label .custom-check-icon {
            opacity: 1;
        }

</head>

            <p class="text-center text-slate-500 mb-8">(กรณีครูลากิจ / ลาป่วย / ไปราชการ / อบรม)</p>

                </div>

                <!-- Teacher Selection -->

                    <div class="flex justify-between items-end mb-3">
                        <label class="block text-lg font-semibold text-slate-700">

                        </label>
                        <button id="clear-selection-btn" class="text-sm text-red-600 hover:text-red-800 underline focus:outline-none">ล้างการเลือก</button>
                    </div>
                    
                    <div id="absent-teachers-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 max-h-64 overflow-y-auto p-2 border border-slate-200 rounded-lg bg-white shadow-inner">
                        <!-- Checkboxes will be injected here via JS -->
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->

                    <i class="fas fa-magic mr-2"></i> จัดตารางสอนแทน
                </button>
                <button id="export-current-tab-btn" class="action-button bg-teal-600 hover:bg-teal-700 focus:ring-teal-300 hidden">

                </button>
                <button id="export-all-teachers-zip-btn" class="action-button bg-red-600 hover:bg-red-700 focus:ring-red-300 hidden">

            1: "08:30 - 09:30 น.", 2: "09:30 - 10:30 น.", 3: "10:30 - 11:30 น.",
            4: "12:30 - 13:30 น.", 5: "13:30 - 14:30 น.", 6: "14:30 - 15:30 น."
        };

        // --- DOM Elements ---
        const datePicker = document.getElementById('date-picker');
        const dayDisplay = document.getElementById('day-display');
        const absentContainer = document.getElementById('absent-teachers-container');
        const generateBtn = document.getElementById('generate-btn');
        const clearBtn = document.getElementById('clear-selection-btn');
        const resultsArea = document.getElementById('results-area');
        
        const tabs = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');
        
        let currentGeneratedData = null; // Store latest generated schedule

        // --- Helpers ---
        function parseDate(dateStr) {
            const date = new Date(dateStr);
            const days = ['วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'];
            const dayName = days[date.getDay()];
            const [y, m, d] = dateStr.split('-');
            const thaiYear = parseInt(y) + 543;
            return { dayName, formattedDate: `${d}/${m}/${thaiYear}` };
        }

        function getGradeLevel(gradeStr) {
            if(!gradeStr) return 0;
            if(gradeStr.includes('ป.')) return parseInt(gradeStr.replace('ป.', ''));
            if(gradeStr.includes('ม.')) return parseInt(gradeStr.replace('ม.', '')) + 6;
            return 0;
        }

        function calculateBaseWorkload() {
            const workloads = {};
            allTeacherData.forEach(t => {
                let count = 0;
                for (const day in t.schedule) {
                    t.schedule[day].forEach(cls => {
                        if (cls.subject && !EXCLUDED_SUBJECTS.includes(cls.subject)) count++;
                    });
                }
                workloads[t.name] = { base: count, sub: 0 };
            });
            return workloads;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- Initialize UI ---
        function init() {

            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            datePicker.value = dateStr;
            updateDayDisplay();

            // Populate checkboxes
            allTeacherData.sort((a, b) => a.name.localeCompare(b.name, 'th')).forEach((t, i) => {
                const id = `chk-${i}`;

                        <label for="${id}" class="flex flex-row items-center p-3 w-full cursor-pointer">
                            <div class="custom-check-box w-5 h-5 flex-shrink-0 border-2 border-slate-300 rounded mr-3 flex items-center justify-center bg-white transition-colors duration-200">
                                <i class="fas fa-check text-white text-xs opacity-0 custom-check-icon transition-opacity duration-200"></i>
                            </div>
                            <span class="text-sm font-medium text-slate-700 truncate leading-tight">${t.name}</span>
                        </label>
                        <select id="${id}-duration" class="hidden mx-3 mb-3 p-1 text-sm border border-slate-300 rounded text-slate-600 bg-slate-50 focus:ring-indigo-500 focus:border-indigo-500">
                            <option value="full">เต็มวัน (คาบ 1-6)</option>
                            <option value="morning">ครึ่งเช้า (คาบ 1-3)</option>
                            <option value="afternoon">ครึ่งบ่าย (คาบ 4-6)</option>
                        </select>
                    </div>
                `;
                absentContainer.appendChild(div);

                // Populate Dropdowns for Detail Tabs
                document.getElementById('teacher-detail-select').innerHTML += `<option value="${t.name}">${t.name}</option>`;
            });

            ['ป.1','ป.2','ป.3','ป.4','ป.5','ป.6','ม.1','ม.2','ม.3'].forEach(g => {
                document.getElementById('student-detail-select').innerHTML += `<option value="${g}">${g}</option>`;
            });

            // Event Listeners
            datePicker.addEventListener('change', updateDayDisplay);

            document.getElementById('student-detail-select').addEventListener('change', renderStudentDetail);
            
            // Setup Export Buttons
            document.getElementById('export-current-tab-btn').addEventListener('click', exportCurrentTab);
            document.getElementById('share-current-tab-btn').addEventListener('click', shareCurrentTab);
            document.getElementById('export-all-teachers-zip-btn').addEventListener('click', exportTeacherZip);
        }

        function updateDayDisplay() {
            const dateInfo = parseDate(datePicker.value);
            dayDisplay.innerHTML = `<i class="fas fa-sun mr-2"></i> ${dateInfo.dayName} ที่ ${dateInfo.formattedDate}`;
            resultsArea.classList.add('hidden'); // Hide results if date changes

        }
        
        function showActionButtons(show) {
            const btns = ['export-current-tab-btn', 'share-current-tab-btn', 'export-all-teachers-zip-btn'];
            btns.forEach(id => {
                if(show) document.getElementById(id).classList.remove('hidden');
                else document.getElementById(id).classList.add('hidden');
            });

        // --- Core Logic ---
        function processSubstitution() {
            const absentDetails = {};
            document.querySelectorAll('.teacher-checkbox-input:checked').forEach(cb => {
                const duration = document.getElementById(cb.id + '-duration').value;
                absentDetails[cb.value] = duration;
            });
            const selectedAbsent = Object.keys(absentDetails);

            if (selectedAbsent.length === 0) {
                showToast("กรุณาเลือกครูที่ไม่อยู่อย่างน้อย 1 คน");
                return;
            }

            const { dayName, formattedDate } = parseDate(datePicker.value);
            
            // ถ้าเป็นเสาร์-อาทิตย์ ให้แจ้งเตือน (แต่ถ้าอยากให้จัดได้ก็เอาออก)
            if (dayName === 'วันเสาร์' || dayName === 'วันอาทิตย์') {
                showToast("วันหยุดสุดสัปดาห์ ไม่มีตารางสอน");
                return;
            }

            const workloads = calculateBaseWorkload();
            const scheduleResult = {
                dateText: `${dayName} ${formattedDate}`,
                dayName: dayName,
                absentTeachers: selectedAbsent,
                absentDetails: absentDetails,
                teacherSubs: [], // [ { tutorName, substitutions: [ { period, classInfo, subTeacher, reason } ] } ]
                finalAssignments: {}, // { period: { grade: { subject, teacher, isSub } } }
                workloads: workloads,
                homeroomSubsNeeded: [],
                homeroomSubAssignments: {}
            };

            // Check for homeroom sub needs
            for (const grade in homeroomAssignments) {
                const teachers = homeroomAssignments[grade];
                const absentHRs = teachers.filter(t => selectedAbsent.includes(t));
                const presentHRs = teachers.filter(t => !selectedAbsent.includes(t));
                
                if (absentHRs.length > 0) {
                    scheduleResult.homeroomSubsNeeded.push({
                        grade: grade,
                        absentTeachers: absentHRs
                    });
                    
                    // หากมีครูประจำชั้นเหลืออยู่ (เช่น มี 2 คน ลา 1 คน) ให้กำหนดเป็นผู้ดูแลอัตโนมัติ
                    if (presentHRs.length > 0) {
                        scheduleResult.homeroomSubAssignments[grade] = presentHRs[0];
                    }
                }
            }

            // Initialize finalAssignments with NORMAL schedules (excluding absent teachers)
            const busySubs = { 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] }; // Track who is subbing in which period

            for(let p=1; p<=6; p++) scheduleResult.finalAssignments[p] = {};

            allTeacherData.forEach(t => {
                const daySchedule = t.schedule[dayName];
                const duration = absentDetails[t.name];
                
                if(daySchedule) {
                    daySchedule.forEach(cls => {
                        if (cls.subject && cls.grade) {
                            let isAbsentThisPeriod = false;
                            if (duration) {
                                if (duration === 'full') isAbsentThisPeriod = true;
                                if (duration === 'morning' && cls.period <= 3) isAbsentThisPeriod = true;
                                if (duration === 'afternoon' && cls.period >= 4) isAbsentThisPeriod = true;
                            }

                            if (!scheduleResult.finalAssignments[cls.period]) scheduleResult.finalAssignments[cls.period] = {};
                            scheduleResult.finalAssignments[cls.period][cls.grade] = {
                                subject: cls.subject,
                                teacher: isAbsentThisPeriod ? null : t.name,
                                originalTeacher: t.name,
                                isSub: false
                            };
                            if (!isAbsentThisPeriod && !EXCLUDED_SUBJECTS.includes(cls.subject)) {
                                busySubs[cls.period].push(t.name); // This teacher is busy teaching normally
                            }
                        }
                    });
                }
            });

            // Find subs for each absent teacher
            selectedAbsent.forEach(absentName => {
                const absentTeacher = allTeacherData.find(t => t.name === absentName);
                const daySchedule = absentTeacher.schedule[dayName];
                const absenceDuration = absentDetails[absentName];
                
                const entry = { tutorName: absentName, substitutions: [] };

                if (daySchedule) {
                    daySchedule.forEach(cls => {
                        if (cls.subject && !EXCLUDED_SUBJECTS.includes(cls.subject) && cls.grade) {
                            
                            // Check duration constraints
                            if (absenceDuration === 'morning' && cls.period > 3) return;
                            if (absenceDuration === 'afternoon' && cls.period < 4) return;

                            // Find candidate
                            let bestSub = null;
                            let reason = "";
                            let candidates = [];
                            const targetGradeLvl = getGradeLevel(cls.grade);

                            allTeacherData.forEach(potentialSub => {
                                if (selectedAbsent.includes(potentialSub.name)) return; // Sub is also absent
                                if (potentialSub.name === 'รองอัจฉรา มาอินทร์' && absentName !== 'ครูวิภาวัลย์ นันท์มนัส') return; // Rule: รองอัจฉรา only subs for วิภาวัลย์
                                if (busySubs[cls.period].includes(potentialSub.name)) return; // Busy

                                const subWorkload = workloads[potentialSub.name].base + workloads[potentialSub.name].sub;
                                
                                // Check if qualified by grade
                                let isQualified = potentialSub.canTeachGrades.includes(cls.grade);

                                // --- ล็อกตายตัว: ถ้าเป็นครูที่มีข้อจำกัดสายชั้น (strictGrade) และไม่ตรงชั้น ให้ข้ามไปเลย ---
                                if (potentialSub.strictGrade && !isQualified) return;

                                let proximity = 99;
                                if (!isQualified) {
                                    potentialSub.canTeachGrades.forEach(g => {
                                        const p = Math.abs(getGradeLevel(g) - targetGradeLvl);
                                        if (p < proximity) proximity = p;
                                    });
                                }

                                candidates.push({ name: potentialSub.name, workload: subWorkload, isQualified, proximity });
                            });

                            if (candidates.length > 0) {
                                // Rule Override
                                if (absentName === 'ครูวิภาวัลย์ นันท์มนัส') {
                                    const ajarra = candidates.find(c => c.name === 'รองอัจฉรา มาอินทร์');
                                    if (ajarra) {
                                        bestSub = ajarra;
                                        reason = "มอบหมายพิเศษ";
                                    }
                                }

                                if (!bestSub) {
                                    // Sort candidates
                                    const qualified = candidates.filter(c => c.isQualified).sort((a,b) => a.workload - b.workload);
                                    if (qualified.length > 0) {
                                        bestSub = qualified[0];
                                        reason = `ครูว่างตรงสายชั้น, คาบรวมสัปดาห์=${bestSub.workload + 1}`;
                                    } else {
                                        const fallback = candidates.sort((a,b) => {
                                            if(a.proximity !== b.proximity) return a.proximity - b.proximity;
                                            return a.workload - b.workload;
                                        });
                                        if(fallback.length > 0){
                                            bestSub = fallback[0];
                                            reason = `ครูใกล้เคียง/คาบน้อยสุด, คาบรวมสัปดาห์=${bestSub.workload + 1}`;
                                        }
                                    }
                                }

                                if (bestSub) {
                                    entry.substitutions.push({ period: cls.period, subject: cls.subject, grade: cls.grade, classInfo: `${cls.subject} (${cls.grade})`, subTeacher: bestSub.name, reason: reason });
                                    workloads[bestSub.name].sub++;
                                    busySubs[cls.period].push(bestSub.name);
                                    
                                    // Update final assignment
                                    if(scheduleResult.finalAssignments[cls.period][cls.grade]) {
                                        scheduleResult.finalAssignments[cls.period][cls.grade].teacher = bestSub.name;
                                        scheduleResult.finalAssignments[cls.period][cls.grade].isSub = true;
                                        scheduleResult.finalAssignments[cls.period][cls.grade].subReason = reason;
                                    }
                                } else {
                                    entry.substitutions.push({ period: cls.period, subject: cls.subject, grade: cls.grade, classInfo: `${cls.subject} (${cls.grade})`, subTeacher: null, reason: "ไม่มีครูว่าง" });
                                }
                            } else {
                                entry.substitutions.push({ period: cls.period, subject: cls.subject, grade: cls.grade, classInfo: `${cls.subject} (${cls.grade})`, subTeacher: null, reason: "ไม่มีครูว่าง" });
                            }
                        }
                    });
                }
                if(entry.substitutions.length > 0) scheduleResult.teacherSubs.push(entry);
            });

            currentGeneratedData = scheduleResult;
            resultsArea.classList.remove('hidden');
            showActionButtons(true);
            renderAllViews();
            showToast("จัดตารางสอนแทนสำเร็จ!");
        }

        // --- Render Functions ---
        function renderAllViews() {
            renderSubSummary();
            renderTeacherView();
            renderEditView();
            renderStudentView();
            renderActiveTabDetail();
            updateAlertIndicators();
        }

        function updateAlertIndicators() {
            const alertDot = document.getElementById('edit-alert-dot');
            const editTabBtn = document.querySelector('button[data-tab="edit-schedule"]');
            if (!alertDot || !editTabBtn || !currentGeneratedData) return;

            let needsAttention = false;
            
            // 1. ตรวจสอบว่ามีห้องที่ยังไม่ได้ระบุผู้ดูแลประจำชั้นหรือไม่
            if (currentGeneratedData.homeroomSubsNeeded) {
                currentGeneratedData.homeroomSubsNeeded.forEach(hr => {
                    if (!currentGeneratedData.homeroomSubAssignments[hr.grade] || currentGeneratedData.homeroomSubAssignments[hr.grade] === "") {
                        needsAttention = true;
                    }
                });
            }

            // 2. ตรวจสอบว่ามีคาบสอนที่ยังไม่มีผู้สอนแทนหรือไม่ (เผื่อระบบสุ่มหาคนไม่ได้)
            if (currentGeneratedData.teacherSubs) {
                currentGeneratedData.teacherSubs.forEach(entry => {
                    entry.substitutions.forEach(sub => {
                        if (!sub.subTeacher) {
                            needsAttention = true;
                        }
                    });
                });
            }

            if (needsAttention) {
                alertDot.classList.remove('hidden');
                alertDot.classList.add('flex');
                editTabBtn.classList.add('!text-red-600'); // เปลี่ยนสีตัวอักษรแท็บให้เป็นสีแดงเพื่อดึงดูดสายตา
            } else {
                alertDot.classList.add('hidden');
                alertDot.classList.remove('flex');
                editTabBtn.classList.remove('!text-red-600');
            }
        }

        function renderActiveTabDetail() {
            const activeTab = document.querySelector('.tab-button.active').dataset.tab;
            if(activeTab === 'teacher-detail-schedule') renderTeacherDetail();
            if(activeTab === 'student-detail-schedule') renderStudentDetail();
        }

        function renderSubSummary() {
            const container = document.getElementById('substitute-summary-schedule-details');
            const noData = document.getElementById('substitute-summary-schedule-nodata');
            document.getElementById('substitute-summary-schedule-header').textContent = `📝 สรุปการสอนแทน ${currentGeneratedData.dateText}`;
            
            // --- Homeroom Sub Section ---
            let hrSection = document.getElementById('homeroom-sub-section');
            if (!hrSection) {
                hrSection = document.createElement('div');
                hrSection.id = 'homeroom-sub-section';
                hrSection.className = 'mb-6';
                const contentArea = document.getElementById('substitute-summary-schedule-content');
                contentArea.insertBefore(hrSection, container);
            }
            hrSection.innerHTML = '';

            if (currentGeneratedData.homeroomSubsNeeded && currentGeneratedData.homeroomSubsNeeded.length > 0) {
                const hrDiv = document.createElement('div');
                hrDiv.className = "bg-emerald-50 p-4 rounded-xl border border-emerald-200 shadow-sm";
                hrDiv.innerHTML = `<h4 class="text-lg font-bold text-emerald-800 mb-3 border-b border-emerald-200 pb-2"><i class="fas fa-chalkboard-teacher mr-2"></i> จัดครูประจำชั้นแทน</h4>`;

                const ul = document.createElement('ul');
                ul.className = "space-y-2 text-sm";

                currentGeneratedData.homeroomSubsNeeded.forEach(hr => {
                    const absentNames = hr.absentTeachers.map(name => name.split(' ')[0]).join(', ');
                    const currentValue = currentGeneratedData.homeroomSubAssignments[hr.grade];
                    
                    const subText = currentValue ? `<strong class="text-emerald-700">${currentValue}</strong>` : `<strong class="text-red-600">ยังไม่ได้ระบุผู้ดูแล</strong>`;

                    ul.innerHTML += `<li class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-emerald-100 pb-2 last:border-0 pt-2">
                        <div class="flex-grow">
                            <span class="font-bold bg-white px-2 py-1 rounded shadow-sm text-emerald-700 mr-2">ชั้น ${hr.grade}</span> 
                            <span class="text-slate-600">แทน: ${absentNames}</span>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <span class="text-slate-500 text-xs hidden sm:inline">ดูแลโดย:</span> ${subText}
                        </div>
                    </li>`;
                });
                hrDiv.appendChild(ul);
                hrSection.appendChild(hrDiv);
            }
            // --- END Homeroom Sub Section ---

            container.innerHTML = '';

            const subsByTeacher = {};
            const unassigned = [];
            currentGeneratedData.teacherSubs.forEach(entry => {
                entry.substitutions.forEach(sub => {
                    if (sub.subTeacher) {
                        if (!subsByTeacher[sub.subTeacher]) subsByTeacher[sub.subTeacher] = [];
                        subsByTeacher[sub.subTeacher].push({ period: sub.period, classInfo: sub.classInfo, grade: sub.grade, original: entry.tutorName, reason: sub.reason });
                    } else {
                        unassigned.push({ period: sub.period, classInfo: sub.classInfo, grade: sub.grade, original: entry.tutorName });
                    }
                });
            });

            if (unassigned.length > 0) {
                const div = document.createElement('div');
                div.className = "bg-red-50 p-4 rounded-xl border border-red-200 shadow-sm md:col-span-2";

                const ul = document.createElement('ul');
                ul.className = "space-y-2 text-sm";
                unassigned.sort((a,b)=>a.period-b.period).forEach(sub => {

                });
                div.appendChild(ul);
                container.appendChild(div);
            }

            const subNames = Object.keys(subsByTeacher).sort();
            if (subNames.length === 0 && unassigned.length === 0) {
                noData.textContent = "ไม่มีการจัดสอนแทนในวันนี้ (อาจไม่มีคาบเรียน หรือครูที่ไม่อยู่ไม่มีคาบสอน)";

                });
                div.appendChild(ul);

            const container = document.getElementById('teacher-schedule-details');

            container.innerHTML = '';

            if (currentGeneratedData.teacherSubs.length === 0) {
                noData.textContent = "ไม่มีข้อมูลการสอนแทน";
                noData.classList.remove('hidden');
                return;
            }
            noData.classList.add('hidden');

            currentGeneratedData.teacherSubs.forEach(entry => {
                const div = document.createElement('div');
                div.className = "bg-red-50 p-4 rounded-xl border border-red-100 shadow-sm";
                div.innerHTML = `<h4 class="text-lg font-bold text-red-800 mb-3"><i class="fas fa-user-times mr-2"></i> ไม่อยู่: ${entry.tutorName}</h4>`;
                const ul = document.createElement('ul');
                ul.className = "space-y-2 text-sm";

        // --- Substitution Override Logic ---
        function getOverrideSelectHtml(period, grade, currentSub, absentName) {
            const targetGradeLvl = getGradeLevel(grade);
            let options = `<option value="">-- ไม่มีคนสอน --</option>`;
            
            const busyInPeriod = [];
            allTeacherData.forEach(t => {
                const cls = t.schedule[currentGeneratedData.dayName]?.find(c => c.period === period);
                const duration = currentGeneratedData.absentDetails[t.name];
                let isAbsentThisPeriod = false;
                if (duration) {
                    if (duration === 'full') isAbsentThisPeriod = true;
                    if (duration === 'morning' && period <= 3) isAbsentThisPeriod = true;
                    if (duration === 'afternoon' && period >= 4) isAbsentThisPeriod = true;
                }

                if (cls && cls.subject && !EXCLUDED_SUBJECTS.includes(cls.subject) && !isAbsentThisPeriod) {
                    busyInPeriod.push(t.name);
                }
            });

            currentGeneratedData.teacherSubs.forEach(entry => {
                entry.substitutions.forEach(sub => {
                    if (sub.period === period && sub.subTeacher && sub.subTeacher !== currentSub) {
                        busyInPeriod.push(sub.subTeacher);
                    }
                });
            });

            const available = [];
            allTeacherData.forEach(t => {
                const duration = currentGeneratedData.absentDetails[t.name];
                let isAbsentThisPeriod = false;
                if (duration) {
                    if (duration === 'full') isAbsentThisPeriod = true;
                    if (duration === 'morning' && period <= 3) isAbsentThisPeriod = true;
                    if (duration === 'afternoon' && period >= 4) isAbsentThisPeriod = true;
                }
                
                if (isAbsentThisPeriod) return; 
                if (t.name === 'รองอัจฉรา มาอินทร์' && absentName !== 'ครูวิภาวัลย์ นันท์มนัส') return; 
                if (busyInPeriod.includes(t.name) && t.name !== currentSub) return; 

                const isQualified = t.canTeachGrades.includes(grade);
                if (t.strictGrade && !isQualified) return; 
                
                let proximity = 99;
                if (!isQualified) {
                    t.canTeachGrades.forEach(g => {
                        const p = Math.abs(getGradeLevel(g) - targetGradeLvl);
                        if (p < proximity) proximity = p;
                    });
                }
                
                available.push({name: t.name, isQualified, proximity, isCurrent: t.name === currentSub});
            });

            available.sort((a, b) => {
                if (a.isCurrent) return -1;
                if (b.isCurrent) return 1;
                if (a.isQualified && !b.isQualified) return -1;
                if (!a.isQualified && b.isQualified) return 1;
                return a.proximity - b.proximity;
            });

            available.forEach(a => {
                const selected = a.isCurrent ? 'selected' : '';
                const label = a.name + (a.isQualified ? " (ตรงชั้น)" : "");
                options += `<option value="${a.name}" ${selected}>${label}</option>`;
            });

            return `<select class="border border-slate-300 rounded p-1 text-sm font-medium bg-white focus:ring-indigo-500 focus:border-indigo-500 w-full max-w-[200px]" data-absent="${absentName}" data-period="${period}" data-grade="${grade}" onchange="changeSubstitute(this)">${options}</select>`;
        }

        window.changeSubstitute = function(selectElem) {
            const absentName = selectElem.getAttribute('data-absent');
            const period = parseInt(selectElem.getAttribute('data-period'));
            const grade = selectElem.getAttribute('data-grade');
            const newSubName = selectElem.value;

            const tutorEntry = currentGeneratedData.teacherSubs.find(e => e.tutorName === absentName);
            if (!tutorEntry) return;
            const subRecord = tutorEntry.substitutions.find(s => s.period === period);
            if (!subRecord) return;
            
            const oldSubName = subRecord.subTeacher;

            if (oldSubName) currentGeneratedData.workloads[oldSubName].sub--;
            if (newSubName) currentGeneratedData.workloads[newSubName].sub++;

            subRecord.subTeacher = newSubName || null;
            subRecord.reason = newSubName ? "เลือกเอง" : "ไม่มีครูว่าง";

            if (currentGeneratedData.finalAssignments[period] && currentGeneratedData.finalAssignments[period][grade]) {
                currentGeneratedData.finalAssignments[period][grade].teacher = newSubName || null;
                currentGeneratedData.finalAssignments[period][grade].isSub = !!newSubName;
            }

            renderAllViews();
            showToast("อัปเดตผู้สอนแทนเรียบร้อย");
        };

        window.changeHomeroomSub = function(selectElem) {
            const grade = selectElem.getAttribute('data-grade');
            const newTeacher = selectElem.value;
            if (currentGeneratedData) {
                currentGeneratedData.homeroomSubAssignments[grade] = newTeacher;
            }
            renderAllViews();
            showToast("อัปเดตครูประจำชั้นแทนเรียบร้อย");
        };

            const tabId = activeTabContent.id;

            } else if(tabId.includes('teacher-schedule')) {
                prefix = "ตารางเฉพาะครูที่สอนแทน";
            } else if(tabId.includes('edit-schedule')) {
                prefix = "ปรับแก้การสอนแทน";
            } else if(tabId.includes('student-schedule')) {

                prefix = `ตารางเรียน_${gName}`;
            }

            showToast("กำลังเตรียมรูปภาพสำหรับแชร์...");

            try {
                const canvas = await html2canvas(activeTabContent, { 
                    scale: 2, 
                    backgroundColor: '#ffffff', 
                    useCORS: true 
                });
                
                canvas.toBlob(async (blob) => {
                    if (!blob) { showToast('ไม่สามารถสร้างรูปภาพได้'); return; }
                    const file = new File([blob], `${prefix}_${datePicker.value}.jpg`, { type: 'image/jpeg' });
                    if (navigator.share && navigator.canShare({files: [file]})) {
                        try { 
                            await navigator.share({
                                files: [file], 
                                title: prefix, 
                                text: `${prefix} ประจำวันที่ ${datePicker.value}`
                            }); 
                        }
                        catch(e) { console.log(e); }
                    } else {
                        showToast("บราว์เซอร์ไม่รองรับการแชร์ไฟล์รูปภาพโดยตรง กรุณาใช้ปุ่ม Export หน้านี้แทน");
                    }
                }, 'image/jpeg');
            } catch(e) {
                console.error(e);
                showToast("เกิดข้อผิดพลาดในการแชร์");
            }
        }

        async function exportTeacherZip() {
            if(!currentGeneratedData) return;
            showToast("กำลังสร้างไฟล์ ZIP...");
            const zip = new JSZip();
            const originalSelectVal = document.getElementById('teacher-detail-select').value;

            // Make detail tab active to render correctly
            tabs.forEach(t => t.classList.remove('active'));
            tabContents.forEach(c => c.classList.remove('active'));
            document.getElementById('teacher-detail-schedule-content').classList.add('active');

            for (const t of allTeacherData) {
                document.getElementById('teacher-detail-select').value = t.name;
                renderTeacherDetail();
                await new Promise(r => setTimeout(r, 50)); // Wait for render
                
                const canvas = await html2canvas(document.getElementById('teacher-detail-schedule-content'), {scale: 2, backgroundColor: '#fff'});
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
                zip.file(`ตารางสอน_${t.name}.jpg`, blob);
            }

            // Restore
            document.getElementById('teacher-detail-select').value = originalSelectVal;
            renderTeacherDetail();
            
            const content = await zip.generateAsync({type:"blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `ตารางสอนครูรายบุคคล_${datePicker.value}.zip`;
            link.click();
            showToast("สร้างไฟล์ ZIP สำเร็จ");
        }
